<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: auto;
  overflow: hidden;
  background: transparent;
}

.cart-box {
  display: inline-block;
  width: auto;
  padding: 0;
  margin: 0;
}

.add-cart-btn {
  display: inline-block;

  width: auto;
  min-width: 0;

  padding: 8px 18px;
  margin: 0;

  border: none;
  border-radius: 20px;

  background: #0b8f5a;
  color: #ffffff;

  font-family: "Times New Roman", serif;
  font-size: 15px;
  font-weight: bold;

  line-height: 1.2;
  white-space: nowrap;

  cursor: pointer;

  transition: all 0.15s ease;

  box-shadow: none;
}

/* Khi rê chuột */
.add-cart-btn:hover {
  background: #087548;
}

/* Khi bấm */
.add-cart-btn:active {
  background: #000000;
  transform: scale(0.96);
}

/* Sau khi thêm */
.add-cart-btn.added {
  background: #000000;
}
</style>
</head>

<body>

<div class="cart-box">
  <button class="add-cart-btn" id="addBtn">
    THÊM VÀO GIỎ
  </button>
</div>

<script>

const product = {
  id: "yen-tinh-che",
  name: "YẾN TINH CHẾ",
  price: 1750000
};

const button = document.getElementById("addBtn");

button.addEventListener("click", function() {

  let cart = JSON.parse(
    localStorage.getItem("anhLinhCart") || "[]"
  );

  const existing = cart.find(
    item => item.id === product.id
  );

  if (existing) {
    existing.quantity += 1;
  } else {
    cart.push({
      id: product.id,
      name: product.name,
      price: product.price,
      quantity: 1
    });
  }

  localStorage.setItem(
    "anhLinhCart",
    JSON.stringify(cart)
  );

  button.classList.add("added");
  button.textContent = "✓ ĐÃ THÊM";

  setTimeout(() => {
    button.classList.remove("added");
    button.textContent = "THÊM VÀO GIỎ";
  }, 1200);

});

</script>

</body>
</html>
