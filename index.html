<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  overflow: hidden;
}

.cart-box {
  width: 260px;
  height: 34px;
  margin: 0 auto;
}

.add-cart-btn {
  width: 260px;
  height: 34px;

  padding: 0;
  margin: 0;

  border: none;
  border-radius: 3px;

  background: #0b8f5a;
  color: white;

  font-family: "Times New Roman", serif;
  font-size: 15px;
  font-weight: bold;

  white-space: nowrap;
  overflow: hidden;

  cursor: pointer;

  transition: background 0.15s ease,
              transform 0.1s ease;
}

/* Rê chuột */
.add-cart-btn:hover {
  background: #087548;
}

/* Khi bấm */
.add-cart-btn:active {
  background: #000000;
  transform: scale(0.98);
}

/* Sau khi thêm */
.add-cart-btn.added {
  background: #000000;
}
</style>
</head>

<body>

<div class="cart-box">

  <button class="add-cart-btn" id="addBtn">
    THÊM VÀO GIỎ HÀNG
  </button>

</div>

<script>

const product = {
  id: "yen-tinh-che",
  name: "YẾN TINH CHẾ",
  price: 1750000
};

const button = document.getElementById("addBtn");

button.addEventListener("click", function () {

  let cart = JSON.parse(
    localStorage.getItem("anhLinhCart") || "[]"
  );

  const existing = cart.find(
    item => item.id === product.id
  );

  if (existing) {

    existing.quantity += 1;

  } else {

    cart.push({
      id: product.id,
      name: product.name,
      price: product.price,
      quantity: 1
    });

  }

  localStorage.setItem(
    "anhLinhCart",
    JSON.stringify(cart)
  );

  /* Đổi sang màu đen */
  button.classList.add("added");
  button.textContent = "✓ ĐÃ THÊM VÀO GIỎ";

  /* Sau 1.2 giây trở lại */
  setTimeout(function () {

    button.classList.remove("added");
    button.textContent = "THÊM VÀO GIỎ HÀNG";

  }, 1200);

});

</script>

</body>
</html>
