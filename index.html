<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=300, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 300px;
  height: 50px;
  overflow: hidden;
  background: transparent;
}

.cart-box {
  width: 300px;
  height: 50px;

  display: flex;
  justify-content: center;
  align-items: center;
}

.add-cart-btn {
  display: block;

  width: 160px;
  height: 30px;

  padding: 0;
  margin: 0;

  border: none;
  border-radius: 18px;

  background: #0b8f5a;
  color: white;

  font-family: "Times New Roman", serif;
  font-size: 12px;
  font-weight: bold;

  white-space: nowrap;
  cursor: pointer;

  transition: 0.15s ease;
}

.add-cart-btn:hover {
  background: #087548;
}

.add-cart-btn:active {
  background: #000000;
}

.add-cart-btn.added {
  background: #000000;
}
</style>
</head>

<body>

<div class="cart-box">
  <button class="add-cart-btn" id="addBtn">
    THÊM VÀO GIỎ HÀNG
  </button>
</div>

<script>

const product = {
  id: "yen-tinh-che",
  name: "YẾN TINH CHẾ",
  price: 1750000
};

const button = document.getElementById("addBtn");

button.addEventListener("click", function() {

  let cart = JSON.parse(
    localStorage.getItem("anhLinhCart") || "[]"
  );

  const existing = cart.find(
    item => item.id === product.id
  );

  if (existing) {
    existing.quantity += 1;
  } else {
    cart.push({
      id: product.id,
      name: product.name,
      price: product.price,
      quantity: 1
    });
  }

  localStorage.setItem(
    "anhLinhCart",
    JSON.stringify(cart)
  );

  button.classList.add("added");
  button.textContent = "✓ ĐÃ THÊM";

  setTimeout(function() {
    button.classList.remove("added");
    button.textContent = "THÊM VÀO GIỎ HÀNG";
  }, 1200);

});

</script>

</body>
</html>
